<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log sheet - mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141318;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#f6f5f8}
a{color:#c9a3e8;text-decoration:none}a:hover{color:#e4cdf6}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1500px;box-sizing:border-box;background:#141318;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:14px 16px 0;display:flex;align-items:center;gap:8px">
    <span style="font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#c9a3e8;background:#2a1737;padding:4px 8px;border-radius:999px">Step 1</span>
    <span style="font-size:12px;color:#77757d">Pick a title</span>
  </div>

  <section aria-labelledby="pick-title" style="padding:12px 16px 24px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h1 id="pick-title" style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:600;font-size:28px;letter-spacing:-0.01em">What did you watch?</h1>
      <button type="button" aria-label="Close" style="width:36px;height:36px;border:0;border-radius:50%;background:#26252b;color:#a19fa8;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <label style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:10px;background:#26252b;box-shadow:inset 0 0 0 1px #4a4851;color:#a19fa8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input type="search" aria-label="Search films and shows" placeholder="Search films, shows, episodes" style="flex-grow:1;border:0;background:transparent;color:#f6f5f8;font-size:16px;outline:none">
    </label>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#a19fa8">Up next</span>
      <button type="button" style="display:flex;align-items:center;gap:12px;padding:10px;border:0;border-radius:10px;background:#2a1737;box-shadow:inset 0 0 0 1px #4b2463;color:#f6f5f8;text-align:start">
        <span style="width:96px;height:54px;flex-shrink:0;border-radius:6px;background:linear-gradient(135deg,#2b4446,#1a2a2c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);position:relative">
          <span style="position:absolute;inset-inline-start:6px;bottom:5px;font-family:'Roboto Mono',monospace;font-size:10px;color:rgba(255,255,255,.85)">S02E06</span>
        </span>
        <span style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <span style="font-family:Newsreader,Georgia,serif;font-weight:600;font-size:17px">Severance</span>
          <span style="font-size:13px;color:#d9d7de">S2 E6 · Attila</span>
          <span style="font-size:11px;color:#a19fa8">52 min · 4 left in season</span>
        </span>
        <span aria-hidden="true" style="width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#9b2ad0;color:#fff;display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
      </button>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #37353d;padding-bottom:8px">
        <span style="font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#a19fa8">Recent</span>
        <a href="#" style="font-size:12px">Clear</a>
      </div>
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="5">
        <a href="#" style="display:flex;align-items:center;gap:12px;padding:8px 0;color:#f6f5f8;border-bottom:1px solid #26252b">
          <span style="{{r.poster}}"></span>
          <span style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}} <span style="font-weight:400;color:#77757d">{{r.year}}</span></span>
            <span style="font-size:12px;color:#a19fa8">{{r.meta}}</span>
          </span>
          <span style="{{r.chip}}">{{r.type}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <div style="display:flex;align-items:center;gap:10px;padding:0 16px 14px">
    <span style="font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#c9a3e8;background:#2a1737;padding:4px 8px;border-radius:999px">Step 2</span>
    <span style="font-size:12px;color:#77757d">Log sheet for a film</span>
    <span style="flex-grow:1;height:1px;background:#37353d"></span>
  </div>

  <div style="flex-grow:1;position:relative;background:linear-gradient(180deg,#1f2c36 0%,#141318 60%);display:flex;flex-direction:column;justify-content:flex-end">
    <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(10,9,13,.72)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position:relative;background:#1d1c22;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5),inset 0 1px 0 #2b2a31;padding:10px 16px 20px;display:flex;flex-direction:column;gap:16px">
      <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:999px;background:#4a4851"></span>

      <div style="display:flex;align-items:center;gap:14px">
        <span style="width:52px;height:78px;flex-shrink:0;border-radius:4px;background:#24394a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></span>
        <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#a19fa8">I watched...</span>
          <h2 id="sheet-title" style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-0.01em">Past Lives <span style="font-weight:500;color:#77757d;font-size:18px">2023</span></h2>
          <span style="font-size:12px;color:#a19fa8">Celine Song · 106 min</span>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px solid #37353d;border-bottom:1px solid #37353d">
        <div style="display:flex;flex-direction:column;gap:4px;padding:8px 0">
          <span style="font-size:12px;color:#a19fa8">Rate <span style="color:#77757d">· 1-10 on Trakt: 9</span></span>
          <div role="radiogroup" aria-label="Rating, 4.5 out of 5" style="display:flex;gap:4px;font-size:40px;line-height:40px">
            <span style="color:#f59e2e">★</span>
            <span style="color:#f59e2e">★</span>
            <span style="color:#f59e2e">★</span>
            <span style="color:#f59e2e">★</span>
            <span style="position:relative;display:inline-block;color:#4a4851">★<span style="position:absolute;top:0;inset-inline-start:0;width:50%;overflow:hidden;color:#f59e2e">★</span></span>
          </div>
        </div>
        <button type="button" aria-label="Like" aria-pressed="true" style="width:52px;height:64px;border:0;background:transparent;color:#f0506e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:11px">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
          Liked
        </button>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        <span id="m-date-label" style="font-size:12px;color:#a19fa8">Watched on</span>
        <div role="radiogroup" aria-labelledby="m-date-label" style="display:flex;gap:6px;flex-wrap:wrap">
          <button type="button" role="radio" aria-checked="true" style="height:32px;padding:0 12px;border:0;border-radius:999px;background:#2a1737;box-shadow:inset 0 0 0 1px #9b2ad0;color:#e4cdf6;font-size:13px">Today</button>
          <button type="button" role="radio" aria-checked="false" style="height:32px;padding:0 12px;border:0;border-radius:999px;background:#26252b;color:#d9d7de;font-size:13px">Release date</button>
          <button type="button" role="radio" aria-checked="false" style="height:32px;padding:0 12px;border:0;border-radius:999px;background:#26252b;color:#d9d7de;font-size:13px">Other date</button>
          <button type="button" role="radio" aria-checked="false" style="height:32px;padding:0 12px;border:0;border-radius:999px;background:#26252b;color:#d9d7de;font-size:13px">Unknown</button>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div style="display:flex;flex-direction:column;gap:2px">
          <span id="m-rewatch" style="font-size:14px;color:#f6f5f8">I've watched this before</span>
          <span style="font-size:11px;color:#77757d">Auto-ticked: logged 3 Mar 2024</span>
        </div>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="m-rewatch" style="width:44px;height:26px;border:0;border-radius:999px;background:#9b2ad0;padding:3px;display:flex;justify-content:flex-end">
          <span style="width:20px;height:20px;border-radius:50%;background:#fff"></span>
        </button>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="m-review" style="font-size:12px;color:#a19fa8">Review</label>
        <textarea id="m-review" placeholder="Add a review..." style="height:96px;box-sizing:border-box;resize:none;border:0;border-radius:10px;background:#26252b;box-shadow:inset 0 0 0 1px #37353d;padding:12px 14px;color:#e6e4ea;font:15px/1.5 Roboto,sans-serif">Second watch and the ending hit harder. In another life.</textarea>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#d9d7de">
          <input type="checkbox" style="width:18px;height:18px;margin:0;accent-color:#9b2ad0">
          Contains spoilers
        </label>
      </div>

      <button type="button" style="display:flex;justify-content:space-between;align-items:center;gap:12px;height:48px;padding:0 14px;border:0;border-radius:10px;background:#26252b;color:#f6f5f8;font-size:14px;text-align:start">
        <span style="display:flex;align-items:center;gap:10px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a19fa8" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h8M18 15v6M15 18h6"></path></svg>
          Add to lists
        </span>
        <span style="font-size:12px;color:#c9a3e8">2 selected</span>
      </button>

      <button type="button" style="height:50px;border:0;border-radius:10px;background:#9b2ad0;color:#fff;font-size:16px;font-weight:500">Save</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const poster = (tone) => 'width:36px;height:54px;flex-shrink:0;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);background:' + tone;
    const chipBase = 'flex-shrink:0;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.04em;display:flex;align-items:center;';
    const chips = {
      Film: chipBase + 'background:#26252b;color:#d9d7de;box-shadow:inset 0 0 0 1px #37353d',
      Show: chipBase + 'background:#1f3346;color:#9fcdf2;box-shadow:inset 0 0 0 1px #2f5577',
      Episode: chipBase + 'background:#2a1737;color:#e4cdf6;box-shadow:inset 0 0 0 1px #4b2463'
    };
    const item = (title, year, meta, type, tone) => ({ title, year, meta, type, chip: chips[type], poster: poster(tone) });
    return {
      recent: [
        item('Past Lives', '2023', 'Celine Song · watched 3 Mar 2024', 'Film', '#24394a'),
        item('Severance', '2022', 'Apple TV+ · 15 of 19 episodes', 'Show', '#2b4446'),
        item('The Bear', '2022', 'FX · S4 E2 next', 'Show', '#4a432f'),
        item('Anora', '2024', 'Sean Baker · on your watchlist', 'Film', '#3f2a3a'),
        item('The Pitt', '2025', 'S1 E15 · 7:00 PM', 'Episode', '#2f3a4a')
      ]
    };
  }
}
</script>
</body>
</html>
