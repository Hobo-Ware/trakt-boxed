<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log composer - film</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141318;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#f6f5f8}
a{color:#c9a3e8;text-decoration:none}a:hover{color:#e4cdf6}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1440px;height:1000px;box-sizing:border-box;background:#141318;position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column">
    <div style="height:64px;border-bottom:1px solid #37353d;display:flex;align-items:center;justify-content:space-between;padding:0 120px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:7px;background:#9b2ad0"></div>
        <div style="width:110px;height:14px;border-radius:4px;background:#2b2a31"></div>
      </div>
      <div style="display:flex;gap:28px">
        <div style="width:48px;height:10px;border-radius:3px;background:#2b2a31"></div>
        <div style="width:48px;height:10px;border-radius:3px;background:#2b2a31"></div>
        <div style="width:48px;height:10px;border-radius:3px;background:#2b2a31"></div>
        <div style="width:60px;height:10px;border-radius:3px;background:#2b2a31"></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <div style="width:220px;height:36px;border-radius:8px;background:#26252b"></div>
        <div style="width:72px;height:36px;border-radius:8px;background:#5b2a78"></div>
        <div style="width:32px;height:32px;border-radius:50%;background:#37353d"></div>
      </div>
    </div>
    <div style="height:380px;background:linear-gradient(180deg,#26303a 0%,#1d242c 55%,#141318 100%)"></div>
    <div style="display:flex;gap:40px;padding:0 120px;margin-top:-170px">
      <div style="width:230px;height:345px;border-radius:4px;background:#24394a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div>
      <div style="flex-grow:1;display:flex;flex-direction:column;gap:14px;padding-top:120px">
        <div style="width:380px;height:40px;border-radius:6px;background:#2b2a31"></div>
        <div style="width:240px;height:14px;border-radius:4px;background:#26252b"></div>
        <div style="width:560px;height:12px;border-radius:4px;background:#1f1e24"></div>
        <div style="width:520px;height:12px;border-radius:4px;background:#1f1e24"></div>
        <div style="width:480px;height:12px;border-radius:4px;background:#1f1e24"></div>
      </div>
      <div style="width:300px;height:360px;border-radius:10px;background:#26252b;margin-top:120px"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(10,9,13,.72)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="log-title" style="position:absolute;top:72px;inset-inline-start:280px;width:880px;box-sizing:border-box;background:#1d1c22;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px #2b2a31;padding:32px;display:flex;flex-direction:column;gap:24px">
    <button type="button" aria-label="Close" style="position:absolute;top:18px;inset-inline-end:18px;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:#a19fa8;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>

    <div style="display:flex;gap:28px">
      <div style="width:140px;flex-shrink:0;display:flex;flex-direction:column;gap:12px">
        <div style="width:140px;height:210px;border-radius:4px;background:#24394a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);position:relative">
          <span style="position:absolute;inset-inline-start:10px;bottom:10px;font-family:Newsreader,Georgia,serif;font-weight:600;font-size:15px;color:rgba(255,255,255,.85)">Past Lives</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:#a19fa8">
          <span>Celine Song</span>
          <span style="font-family:'Roboto Mono',monospace;color:#77757d">106 min</span>
        </div>
      </div>

      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#a19fa8">I watched...</span>
            <h2 id="log-title" style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:600;font-size:36px;letter-spacing:-0.01em">Past Lives <span style="font-weight:500;color:#77757d;font-size:26px">2023</span></h2>
          </div>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:28px;padding-inline-end:36px">
              <div style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:13px;color:#a19fa8">Rating</span>
                <div role="radiogroup" aria-label="Rating, 4.5 out of 5" style="display:flex;gap:2px;font-size:28px;line-height:28px">
                  <span style="color:#f59e2e">★</span>
                  <span style="color:#f59e2e">★</span>
                  <span style="color:#f59e2e">★</span>
                  <span style="color:#f59e2e">★</span>
                  <span style="position:relative;display:inline-block;color:#4a4851">★<span style="position:absolute;top:0;inset-inline-start:0;width:50%;overflow:hidden;color:#f59e2e">★</span></span>
                </div>
                <span style="font-size:12px;color:#77757d">1-10 on Trakt: <span style="font-family:'Roboto Mono',monospace;color:#a19fa8">9</span></span>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
                <span style="font-size:13px;color:#a19fa8">Like</span>
                <button type="button" aria-label="Like" aria-pressed="true" style="width:40px;height:34px;border:0;background:transparent;color:#f0506e;display:flex;align-items:center;justify-content:center;padding:0">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
                </button>
              </div>
            </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px">
          <span id="date-label" style="font-size:13px;color:#a19fa8">Watched on</span>
          <div style="display:flex;align-items:center;gap:12px">
            <div role="radiogroup" aria-labelledby="date-label" style="display:flex;align-items:center;gap:2px;padding:3px;border-radius:9px;background:#26252b;box-shadow:inset 0 0 0 1px #37353d">
              <button type="button" role="radio" aria-checked="false" style="height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#d9d7de;font-size:13px">Today</button>
              <button type="button" role="radio" aria-checked="false" style="height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#d9d7de;font-size:13px">Release date</button>
              <div role="radio" aria-checked="true" style="height:32px;padding:0 4px 0 12px;border-radius:6px;background:#2a1737;box-shadow:inset 0 0 0 1px #9b2ad0;display:flex;align-items:center;gap:8px;font-size:13px;color:#e4cdf6">
                <span>Other date</span>
                <label style="display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:5px;background:#141318;color:#f6f5f8">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
                  <input type="text" aria-label="Watch date" value="26 Sep 2026" style="width:82px;border:0;background:transparent;color:#f6f5f8;font-family:'Roboto Mono',monospace;font-size:12px;outline:none">
                </label>
              </div>
              <button type="button" role="radio" aria-checked="false" style="height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#d9d7de;font-size:13px">Unknown</button>
            </div>
            <button type="button" style="height:38px;padding:0 14px;border-radius:8px;border:0;background:#26252b;box-shadow:inset 0 0 0 1px #37353d;color:#f6f5f8;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px">
              <span style="width:8px;height:8px;border-radius:50%;background:#f0506e;box-shadow:0 0 0 3px rgba(240,80,110,.25)"></span>
              Check in now
            </button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#f6f5f8">
            <input type="checkbox" checked style="width:18px;height:18px;margin:0;accent-color:#9b2ad0">
            I've watched this before
          </label>
          <span style="font-size:12px;color:#77757d;padding-inline-start:28px">Auto-ticked: you logged this on 3 Mar 2024</span>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:minmax(0, 1fr) 260px;gap:32px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <label for="review" style="font-size:13px;color:#a19fa8">Review</label>
          <div role="toolbar" aria-label="Formatting" style="display:flex;gap:4px">
            <button type="button" aria-label="Bold" style="width:30px;height:28px;border:0;border-radius:6px;background:#26252b;color:#d9d7de;font-weight:700;font-size:14px">B</button>
            <button type="button" aria-label="Italic" style="width:30px;height:28px;border:0;border-radius:6px;background:#26252b;color:#d9d7de;font-style:italic;font-family:Newsreader,Georgia,serif;font-size:15px">I</button>
            <button type="button" aria-label="Quote" style="width:30px;height:28px;border:0;border-radius:6px;background:#26252b;color:#d9d7de;display:flex;align-items:center;justify-content:center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7h4v4c0 3-2 5-4 6M15 7h4v4c0 3-2 5-4 6"></path></svg>
            </button>
            <button type="button" aria-label="Link" style="width:30px;height:28px;border:0;border-radius:6px;background:#26252b;color:#d9d7de;display:flex;align-items:center;justify-content:center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
            </button>
            <button type="button" aria-label="Spoiler" style="height:28px;padding:0 8px;border:0;border-radius:6px;background:#26252b;color:#d9d7de;display:flex;align-items:center;gap:5px;font-size:12px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"></path></svg>
              Spoiler
            </button>
          </div>
        </div>
        <textarea id="review" style="height:188px;box-sizing:border-box;resize:none;border:0;border-radius:10px;background:#26252b;box-shadow:inset 0 0 0 1px #37353d;padding:14px 16px;color:#e6e4ea;font:15px/1.6 Roboto,sans-serif">Song lets the silences do the heavy lifting. The bar scene is three people and a translation problem, and it is the most tense twenty minutes I sat through all year.

Second watch and the ending hit harder. Nora is not choosing between two men, she is saying goodbye to a version of herself. In another life.</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#d9d7de">
            <input type="checkbox" style="width:18px;height:18px;margin:0;accent-color:#9b2ad0">
            Contains spoilers
          </label>
          <span style="font-family:'Roboto Mono',monospace;font-size:12px;color:#77757d">341 characters</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="lists-input" style="font-size:13px;color:#a19fa8">Add to lists</label>
          <div style="border-radius:10px;background:#26252b;box-shadow:inset 0 0 0 1px #37353d;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            <span style="height:26px;padding:0 6px 0 10px;border-radius:999px;background:#2a1737;box-shadow:inset 0 0 0 1px #9b2ad0;color:#e4cdf6;font-size:12px;display:flex;align-items:center;gap:4px">Best of the 2020s
              <button type="button" aria-label="Remove Best of the 2020s" style="width:18px;height:18px;border:0;padding:0;background:transparent;color:#c9a3e8;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </span>
            <span style="height:26px;padding:0 6px 0 10px;border-radius:999px;background:#2a1737;box-shadow:inset 0 0 0 1px #9b2ad0;color:#e4cdf6;font-size:12px;display:flex;align-items:center;gap:4px">Films that wrecked me
              <button type="button" aria-label="Remove Films that wrecked me" style="width:18px;height:18px;border:0;padding:0;background:transparent;color:#c9a3e8;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </span>
            <input id="lists-input" type="text" placeholder="Search your lists" style="flex-grow:1;min-width:100px;height:26px;border:0;background:transparent;color:#f6f5f8;font-size:13px;outline:none">
          </div>
          <button type="button" style="align-self:flex-start;height:28px;padding:0;border:0;background:transparent;color:#c9a3e8;font-size:13px;display:flex;align-items:center;gap:6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            New list
          </button>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="note" style="font-size:13px;color:#a19fa8;display:flex;align-items:center;gap:6px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            Private note
          </label>
          <input id="note" type="text" value="With Mira at the Prince Charles, 35mm" style="height:36px;box-sizing:border-box;border:0;border-radius:8px;background:#26252b;box-shadow:inset 0 0 0 1px #37353d;padding:0 12px;color:#f6f5f8;font-size:13px">
          <span style="font-size:12px;color:#77757d">Only you can see this · 500 characters</span>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid #37353d;padding-top:20px">
      <div style="display:flex;align-items:center;gap:10px">
        <button type="button" role="switch" aria-checked="true" aria-labelledby="share-label" style="width:40px;height:22px;border:0;border-radius:999px;background:#9b2ad0;padding:2px;display:flex;justify-content:flex-end">
          <span style="width:18px;height:18px;border-radius:50%;background:#fff"></span>
        </button>
        <span id="share-label" style="font-size:14px;color:#d9d7de">Share to activity</span>
      </div>
      <div style="display:flex;gap:10px">
        <button type="button" style="height:40px;padding:0 18px;border:0;border-radius:8px;background:#26252b;box-shadow:inset 0 0 0 1px #37353d;color:#f6f5f8;font-size:14px;font-weight:500">Cancel</button>
        <button type="button" style="height:40px;padding:0 26px;border:0;border-radius:8px;background:#9b2ad0;color:#fff;font-size:14px;font-weight:500">Save</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
