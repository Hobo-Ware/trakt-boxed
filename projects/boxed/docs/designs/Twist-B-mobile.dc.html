<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twist B - Tactile - mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141318;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#f6f5f8}
a{color:#c9a3e8;text-decoration:none}a:hover{color:#e4cdf6}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1600px;box-sizing:border-box;background:#141318;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <header style="height:52px;flex-shrink:0;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #37353d">
    <a href="#" style="display:flex;align-items:center;gap:8px;color:#f6f5f8">
      <span style="width:26px;height:26px;border-radius:7px;background:#9b2ad0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff">t</span>
      <span style="font-size:18px;font-weight:700">trakt<span style="font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:500;color:#c9a3e8;margin-inline-start:3px">boxed</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Search" style="width:36px;height:36px;border:0;background:transparent;color:#f6f5f8;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
      <span style="width:30px;height:30px;border-radius:50%;background:#4a2f2f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500">A</span>
    </div>
  </header>

  <div style="padding:18px 16px 14px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <h1 style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:600;font-size:30px;letter-spacing:-0.01em">Ana's diary</h1>
      <span style="font-size:13px;color:#a19fa8"><span style="font-family:Newsreader,Georgia,serif;font-weight:600;font-variant-numeric:tabular-nums lining-nums;font-size:15px;color:#d9d7de">212</span> entries in 2026</span>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;white-space:nowrap">
      <button type="button" style="flex-shrink:0;display:flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">2026
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button type="button" aria-pressed="false" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">Films</button>
      <button type="button" aria-pressed="false" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">Shows</button>
      <button type="button" aria-pressed="true" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#2a1737;color:#e4cdf6;box-shadow:inset 0 0 0 1px #9b2ad0;font-size:13px">Both</button>
      <button type="button" aria-pressed="false" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">Rated only</button>
    </div>
  </div>

  <sc-for list="{{months}}" as="m" hint-placeholder-count="2">
    <section style="display:flex;flex-direction:column">
      <h2 style="position:sticky;top:0;z-index:2;margin:0;height:40px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#1d1c22;border-top:1px solid #37353d;border-bottom:1px solid #37353d;font-size:12px;font-weight:500;letter-spacing:.1em;color:#c9a3e8">
        <span>{{m.label}}</span>
        <span style="font-size:11px;letter-spacing:0;color:#77757d"><span style="font-family:Newsreader,Georgia,serif;font-weight:600;font-variant-numeric:tabular-nums lining-nums;font-size:14px;color:#a19fa8">{{m.count}}</span> entries</span>
      </h2>
      <div role="list" aria-label="{{m.label}}" style="display:flex;flex-direction:column;gap:10px;padding:14px 16px 18px">
        <sc-for list="{{m.rows}}" as="r" hint-placeholder-count="7">
          <article role="listitem" style="position:relative;display:flex;flex-direction:column;border-radius:10px;background:#1d1c22;box-shadow:inset 0 0 0 1px #2b2a31, inset 0 1px 0 rgba(255,255,255,.04), 0 8px 18px rgba(0,0,0,.25)">
            <div style="position:relative;display:grid;grid-template-columns:62px minmax(0, 1fr);min-height:84px">
              <span aria-hidden="true" style="position:absolute;top:-7px;inset-inline-start:55px;width:14px;height:14px;border-radius:50%;background:#141318;z-index:1"></span>
              <sc-if value="{{r.closed}}" hint-placeholder-val="{{ true }}">
                <span aria-hidden="true" style="position:absolute;bottom:-7px;inset-inline-start:55px;width:14px;height:14px;border-radius:50%;background:#141318;z-index:1"></span>
              </sc-if>
              <span aria-hidden="true" style="{{r.perf}}"></span>
              <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Roboto Mono',monospace">
                <span style="font-size:10px;letter-spacing:.14em;color:#c9a3e8">{{m.short}}</span>
                <span style="font-size:22px;line-height:1;color:#f6f5f8">{{r.day}}</span>
                <span style="font-size:9px;letter-spacing:.12em;color:#77757d">{{r.wd}}</span>
              </div>
              <div style="display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;min-width:0">
                <sc-if value="{{r.hasThumb}}" hint-placeholder-val="{{ true }}">
                  <span style="{{r.thumb}}"></span>
                </sc-if>
                <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex-grow:1">
                  <div style="display:flex;align-items:baseline;gap:6px;min-width:0">
                    <a href="#" style="font-family:Newsreader,Georgia,serif;font-weight:600;font-size:17px;color:#f6f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</a>
                    <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#77757d;flex-shrink:0">{{r.year}}</span>
                  </div>
                  <sc-if value="{{r.code}}" hint-placeholder-val="{{ false }}">
                    <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#c9a3e8">{{r.code}}</span>
                  </sc-if>
                  <div style="display:flex;align-items:center;gap:8px">
                    <span style="font-family:Newsreader,Georgia,serif;font-weight:600;font-variant-numeric:tabular-nums lining-nums;font-size:16px;line-height:1;color:#f6f5f8">{{r.rating}}</span>
                    <span style="color:#f59e2e;font-size:12px;white-space:nowrap">{{r.stars}}</span>
                    <sc-if value="{{r.like}}" hint-placeholder-val="{{ true }}">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="#f0506e" stroke="#f0506e" stroke-width="1.8" role="img" aria-label="Liked"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>
                    </sc-if>
                    <sc-if value="{{r.rewatch}}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d9d7de" stroke-width="1.8" role="img" aria-label="Rewatch"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15"></path><path d="M4 20v-5h5"></path></svg>
                    </sc-if>
                    <sc-if value="{{r.review}}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a19fa8" stroke-width="1.8" role="img" aria-label="Has review"><path d="M5 6h14M5 11h14M5 16h9"></path></svg>
                    </sc-if>
                    <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a19fa8" stroke-width="1.8" role="img" aria-label="Private note"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                    </sc-if>
                  </div>
                </div>
                <sc-if value="{{r.hasPile}}" hint-placeholder-val="{{ false }}">
                  <button type="button" aria-expanded="false" aria-label="{{r.fanLabel}}" style="position:relative;width:86px;height:56px;flex-shrink:0;border:0;padding:0;background:transparent">
                    <sc-for list="{{r.stills}}" as="st" hint-placeholder-count="3">
                      <span style="{{st.pile}}">
                        <span style="{{grain}}"></span>
                      </span>
                    </sc-for>
                    <span style="position:absolute;inset-inline-end:-2px;bottom:-4px;z-index:4;height:18px;padding:0 6px;border-radius:999px;background:#26252b;box-shadow:0 0 0 2px #1d1c22;font-family:'Roboto Mono',monospace;font-size:10px;line-height:18px;color:#d9d7de">{{r.count}}</span>
                  </button>
                </sc-if>
                <sc-if value="{{r.expanded}}" hint-placeholder-val="{{ false }}">
                  <button type="button" aria-expanded="true" aria-label="Stack episodes" style="flex-shrink:0;display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;border:0;background:#2a1737;color:#e4cdf6;box-shadow:inset 0 0 0 1px #9b2ad0;font-size:12px">{{r.count}}
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="transform:rotate(180deg)"><path d="M6 9l6 6 6-6"></path></svg>
                  </button>
                </sc-if>
              </div>
            </div>
            <sc-if value="{{r.expanded}}" hint-placeholder-val="{{ false }}">
              <div aria-hidden="true" style="position:relative;height:14px">
                <span style="position:absolute;top:6px;left:14px;right:14px;height:0;border-top:2px dashed #37353d"></span>
                <span style="position:absolute;top:0;inset-inline-start:-7px;width:14px;height:14px;border-radius:50%;background:#141318"></span>
                <span style="position:absolute;top:0;inset-inline-end:-7px;width:14px;height:14px;border-radius:50%;background:#141318"></span>
              </div>
              <div role="list" aria-label="Episodes in this binge" style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;padding:6px 12px 14px">
                <sc-for list="{{r.stills}}" as="st" hint-placeholder-count="3">
                  <a href="#" role="listitem" style="display:flex;flex-direction:column;gap:6px;min-width:0;color:#f6f5f8">
                    <span style="{{st.fan}}">
                      <span style="{{grain}}"></span>
                      <span style="position:absolute;left:6px;bottom:5px;font-family:'Roboto Mono',monospace;font-size:10px;color:rgba(255,255,255,.9)">{{st.code}}</span>
                    </span>
                    <span style="font-family:Newsreader,Georgia,serif;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{st.title}}</span>
                    <span style="display:flex;align-items:center;gap:5px">
                      <span style="font-family:Newsreader,Georgia,serif;font-weight:600;font-variant-numeric:tabular-nums lining-nums;font-size:13px;line-height:1;color:#f6f5f8">{{st.rating}}</span>
                      <span style="color:#f59e2e;font-size:10px;white-space:nowrap">{{st.stars}}</span>
                    </span>
                    <span style="font-family:'Roboto Mono',monospace;font-size:10px;color:#77757d">{{st.time}}</span>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </article>
        </sc-for>
      </div>
    </section>
  </sc-for>

  <nav aria-label="Primary" style="position:absolute;left:0;right:0;bottom:0;height:64px;box-sizing:border-box;background:#1d1c22;border-top:1px solid #37353d;display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));align-items:center;z-index:3">
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#a19fa8;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Home
    </a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#a19fa8;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg>Browse
    </a>
    <div style="display:flex;justify-content:center">
      <button type="button" aria-label="Log" style="width:52px;height:52px;margin-top:-22px;border-radius:50%;border:0;background:#9b2ad0;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #141318">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#a19fa8;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path></svg>Watching
    </a>
    <a href="#" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#e4cdf6;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = ['#3b2f4a', '#24394a', '#4a2f2f', '#2f4a3b', '#4a432f', '#2f3a4a', '#3f2a3a', '#2b4446', '#463a2a', '#333046'];
    const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const noise = 'repeating-radial-gradient(circle at 13% 27%, rgba(255,255,255,.07) 0 1px, rgba(255,255,255,0) 1px 3px), repeating-radial-gradient(circle at 71% 64%, rgba(0,0,0,.1) 0 1px, rgba(0,0,0,0) 1px 4px), repeating-radial-gradient(circle at 42% 88%, rgba(255,255,255,.05) 0 1px, rgba(255,255,255,0) 1px 5px), repeating-linear-gradient(37deg, rgba(255,255,255,.035) 0 1px, rgba(255,255,255,0) 1px 3px), repeating-linear-gradient(-53deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 2px)';
    const bevel = 'inset 1px 1px 0 rgba(255,255,255,.13), inset -1px -1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.05)';
    const cardStock = (bg, extra) => 'position:relative;overflow:hidden;border-radius:4px;background:linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.02) 14%, rgba(255,255,255,0) 30%), ' + bg + ';box-shadow:' + bevel + (extra ? ', ' + extra : '');
    const stillBg = [
      'radial-gradient(ellipse at 40% 35%, #8a9aa3 0%, #4b5a63 50%, #1f262b 100%)',
      'radial-gradient(ellipse at 60% 40%, #4d7c79 0%, #2b4446 55%, #151f1f 100%)',
      'radial-gradient(ellipse at 30% 40%, #5b6e4f 0%, #2f3a2a 55%, #1a2019 100%)',
      'radial-gradient(ellipse at 50% 30%, #7a5a45 0%, #463a2a 55%, #1d1712 100%)'
    ];
    const pile = [{ left: 0, top: 8, rot: -3 }, { left: 14, top: 5, rot: 0 }, { left: 28, top: 8, rot: 3 }];
    const still = (i, bg, o) => Object.assign({}, o, {
      pile: 'position:absolute;display:block;top:' + pile[i].top + 'px;inset-inline-start:' + pile[i].left + 'px;width:56px;height:32px;z-index:' + (i + 1) + ';transform:rotate(' + pile[i].rot + 'deg);' + cardStock(bg, '0 4px 10px rgba(0,0,0,.5)'),
      fan: 'display:block;width:100%;aspect-ratio:16/9;' + cardStock(bg, '0 6px 14px rgba(0,0,0,.45)')
    });
    const entry = (month, o) => {
      const expanded = Boolean(o.expanded);
      const hasPile = Boolean(o.stills) && !expanded;
      return Object.assign({
        year: '', code: '', like: false, rewatch: false, review: false, note: false, stills: [], count: '', fanLabel: ''
      }, o, {
        expanded,
        hasPile,
        hasThumb: !o.stills,
        closed: !expanded,
        wd: weekdays[new Date(2026, month, Number(o.day)).getDay()],
        perf: 'position:absolute;top:10px;bottom:' + (expanded ? '0' : '10px') + ';inset-inline-start:61px;width:0;border-inline-start:2px dashed #37353d',
        thumb: 'width:40px;height:60px;flex-shrink:0;' + cardStock(tone[(o.tone || 0) % 10])
      });
    };
    const sep = (o) => entry(8, o);
    const aug = (o) => entry(7, o);
    return {
      grain: 'position:absolute;inset:0;opacity:.55;mix-blend-mode:overlay;background-image:' + noise,
      months: [
        {
          label: 'SEPTEMBER 2026', short: 'SEP', count: '14',
          rows: [
            sep({ day: '26', title: 'Sinners', year: '2025', rating: '4.5', stars: '★★★★½', tone: 2, like: true, review: true }),
            sep({
              day: '24', title: 'Severance', year: '2022', code: 'S2 E4-E6 · binge', rating: '5.0', stars: '★★★★★', like: true, review: true, expanded: true, count: '3 eps',
              stills: [
                still(0, stillBg[0], { code: 'S2 E4', title: 'Woe\'s Hollow', rating: '5.0', stars: '★★★★★', time: '20:12' }),
                still(1, stillBg[1], { code: 'S2 E5', title: 'Trojan\'s Horse', rating: '4.0', stars: '★★★★', time: '21:05' }),
                still(2, stillBg[2], { code: 'S2 E6', title: 'Attila', rating: '4.5', stars: '★★★★½', time: '22:01' })
              ]
            }),
            sep({ day: '21', title: 'One Battle After Another', year: '2025', rating: '4.5', stars: '★★★★½', tone: 4, like: true, review: true }),
            sep({ day: '19', title: 'Anora', year: '2024', rating: '3.5', stars: '★★★½', tone: 6, note: true }),
            sep({
              day: '17', title: 'The Bear', year: '2022', code: 'S4 E1-E2', rating: '4.0', stars: '★★★★', count: '2', fanLabel: 'Fan out 2 episodes',
              stills: [still(0, stillBg[3], {}), still(1, stillBg[1], {})]
            }),
            sep({ day: '14', title: 'Andor', year: '2022', code: 'Season 2 rated', rating: '5.0', stars: '★★★★★', tone: 1, like: true, review: true }),
            sep({ day: '12', title: 'Past Lives', year: '2023', code: 'Rewatch · 3rd viewing', rating: '5.0', stars: '★★★★★', tone: 0, like: true, rewatch: true, review: true }),
            sep({ day: '8', title: 'The Substance', year: '2024', rating: '3.0', stars: '★★★', tone: 3 })
          ]
        },
        {
          label: 'AUGUST 2026', short: 'AUG', count: '19',
          rows: [
            aug({
              day: '30', title: 'Severance', year: '2022', code: 'S2 E1-E3', rating: '4.5', stars: '★★★★½', like: true, count: '3', fanLabel: 'Fan out 3 episodes',
              stills: [still(0, stillBg[1], {}), still(1, stillBg[0], {}), still(2, stillBg[2], {})]
            }),
            aug({ day: '27', title: 'Conclave', year: '2024', rating: '4.0', stars: '★★★★', tone: 9, review: true })
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
