<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diary - mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141318;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#f6f5f8}
a{color:#c9a3e8;text-decoration:none}a:hover{color:#e4cdf6}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1900px;box-sizing:border-box;background:#141318;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <header style="height:52px;flex-shrink:0;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #37353d">
    <a href="#" style="display:flex;align-items:center;gap:8px;color:#f6f5f8">
      <span style="width:26px;height:26px;border-radius:7px;background:#9b2ad0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff">t</span>
      <span style="font-size:18px;font-weight:700">trakt<span style="font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:500;color:#c9a3e8;margin-inline-start:3px">boxed</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Search" style="width:36px;height:36px;border:0;background:transparent;color:#f6f5f8;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
      <span style="width:30px;height:30px;border-radius:50%;background:#4a2f2f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500">A</span>
    </div>
  </header>

  <div style="padding:18px 16px 14px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <h1 style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:600;font-size:30px;letter-spacing:-0.01em">Ana's diary</h1>
      <span style="font-size:13px;color:#a19fa8">212 entries in 2026</span>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;white-space:nowrap">
      <button type="button" style="flex-shrink:0;display:flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">2026
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button type="button" aria-pressed="false" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">Films</button>
      <button type="button" aria-pressed="false" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">Shows</button>
      <button type="button" aria-pressed="true" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#2a1737;color:#e4cdf6;box-shadow:inset 0 0 0 1px #9b2ad0;font-size:13px">Both</button>
      <button type="button" aria-pressed="false" style="flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;border:0;background:#26252b;color:#d9d7de;font-size:13px">Rated only</button>
    </div>
  </div>

  <sc-for list="{{months}}" as="m" hint-placeholder-count="2">
    <section style="display:flex;flex-direction:column">
      <h2 style="position:sticky;top:0;z-index:1;margin:0;height:40px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#1d1c22;border-top:1px solid #37353d;border-bottom:1px solid #37353d;font-size:12px;font-weight:500;letter-spacing:.1em;color:#c9a3e8">
        <span>{{m.label}}</span>
        <span style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:0;color:#77757d">{{m.count}}</span>
      </h2>
      <sc-for list="{{m.rows}}" as="r" hint-placeholder-count="9">
        <sc-if value="{{r.isMain}}" hint-placeholder-val="{{ true }}">
          <div style="{{r.rowStyle}}">
            <div style="width:44px;height:52px;flex-shrink:0;box-sizing:border-box;border-radius:6px;box-shadow:inset 0 0 0 1px #37353d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px">
              <span style="font-size:20px;font-weight:300;color:#d9d7de;line-height:1">{{r.day}}</span>
              <span style="font-size:10px;letter-spacing:.06em;color:#77757d">{{r.wd}}</span>
            </div>
            <span style="{{r.thumb}}"></span>
            <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex-grow:1">
              <div style="display:flex;align-items:baseline;gap:6px;min-width:0">
                <a href="#" style="font-family:Newsreader,Georgia,serif;font-weight:600;font-size:17px;color:#f6f5f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</a>
                <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#77757d;flex-shrink:0">{{r.year}}</span>
              </div>
              <sc-if value="{{r.code}}" hint-placeholder-val="{{ true }}">
                <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#c9a3e8">{{r.code}}</span>
              </sc-if>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="color:#f59e2e;font-size:13px">{{r.stars}}</span>
                <sc-if value="{{r.like}}" hint-placeholder-val="{{ true }}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="#f0506e" stroke="#f0506e" stroke-width="1.8" aria-label="Liked"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>
                </sc-if>
                <sc-if value="{{r.rewatch}}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a19fa8" stroke-width="1.8" aria-label="Rewatch"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15"></path><path d="M4 20v-5h5"></path></svg>
                </sc-if>
                <sc-if value="{{r.review}}" hint-placeholder-val="{{ true }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a19fa8" stroke-width="1.8" aria-label="Has review"><path d="M5 6h14M5 11h14M5 16h9"></path></svg>
                </sc-if>
                <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a19fa8" stroke-width="1.8" aria-label="Private note"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                </sc-if>
              </div>
            </div>
            <sc-if value="{{r.group}}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-expanded="{{r.expanded}}" style="{{r.expStyle}}">{{r.groupLabel}}
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="{{r.chevStyle}}"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{r.isEp}}" hint-placeholder-val="{{ false }}">
          <div style="{{r.rowStyle}}">
            <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#c9a3e8;width:44px;flex-shrink:0">{{r.code}}</span>
            <a href="#" style="font-family:Newsreader,Georgia,serif;font-weight:600;font-size:15px;color:#d9d7de;flex-grow:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</a>
            <span style="color:#f59e2e;font-size:12px;white-space:nowrap">{{r.stars}}</span>
          </div>
        </sc-if>
      </sc-for>
    </section>
  </sc-for>

  <nav aria-label="Primary" style="position:absolute;left:0;right:0;bottom:0;height:64px;box-sizing:border-box;background:#1d1c22;border-top:1px solid #37353d;display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));align-items:center;z-index:3">
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#a19fa8;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Home
    </a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#a19fa8;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg>Browse
    </a>
    <div style="display:flex;justify-content:center">
      <button type="button" aria-label="Log" style="width:52px;height:52px;margin-top:-22px;border-radius:50%;border:0;background:#9b2ad0;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #141318">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#a19fa8;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path></svg>Watching
    </a>
    <a href="#" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#e4cdf6;font-size:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = ['#3b2f4a', '#24394a', '#4a2f2f', '#2f4a3b', '#4a432f', '#2f3a4a', '#3f2a3a', '#2b4446', '#463a2a', '#333046'];
    const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const main = (month, o) => Object.assign({
      isMain: true, isEp: false, code: '', group: false, like: false, rewatch: false, review: false, note: false, expanded: 'false', groupLabel: ''
    }, o, {
      wd: weekdays[new Date(2026, month, Number(o.day)).getDay()],
      rowStyle: 'display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid ' + (o.expanded === 'true' ? '#1d1c22;background:#1d1c22' : '#26252b'),
      thumb: 'width:40px;height:60px;flex-shrink:0;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);background:' + tone[o.tone % 10],
      expStyle: 'flex-shrink:0;display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;border:0;font-size:12px;' + (o.expanded === 'true' ? 'background:#2a1737;color:#e4cdf6;box-shadow:inset 0 0 0 1px #9b2ad0' : 'background:#26252b;color:#d9d7de'),
      chevStyle: o.expanded === 'true' ? 'transform:rotate(180deg)' : ''
    });
    const ep = (code, title, stars, last) => ({
      isMain: false, isEp: true, code, title, stars,
      rowStyle: 'display:flex;align-items:center;gap:10px;height:40px;box-sizing:border-box;padding:0 16px 0 72px;background:#1d1c22;border-bottom:1px solid ' + (last ? '#26252b' : '#1d1c22')
    });
    const sep = (o) => main(8, o);
    const aug = (o) => main(7, o);
    return {
      months: [
        {
          label: 'SEPTEMBER 2026', count: '14 entries',
          rows: [
            sep({ day: '26', title: 'Sinners', year: '2025', stars: '★★★★½', tone: 2, like: true, review: true }),
            sep({ day: '24', title: 'Severance', year: '2022', code: 'S2 E4-E6', stars: '★★★★★', tone: 5, like: true, review: true, group: true, expanded: 'true', groupLabel: '3 episodes' }),
            ep('S2 E4', 'Woe\'s Hollow', '★★★★★', false),
            ep('S2 E5', 'Trojan\'s Horse', '★★★★', false),
            ep('S2 E6', 'Attila', '★★★★½', true),
            sep({ day: '21', title: 'One Battle After Another', year: '2025', stars: '★★★★½', tone: 4, like: true, review: true }),
            sep({ day: '19', title: 'Anora', year: '2024', stars: '★★★½', tone: 6, rewatch: true, note: true }),
            sep({ day: '17', title: 'The Bear', year: '2022', code: 'S4 E1-E2', stars: '★★★★', tone: 8, group: true, groupLabel: '2 episodes' }),
            sep({ day: '14', title: 'Andor', year: '2022', code: 'Season 2 rated', stars: '★★★★★', tone: 1, like: true, review: true }),
            sep({ day: '12', title: 'Past Lives', year: '2023', stars: '★★★★★', tone: 0, like: true, rewatch: true, review: true }),
            sep({ day: '8', title: 'The Substance', year: '2024', stars: '★★★', tone: 3 }),
            sep({ day: '3', title: 'Aftersun', year: '2022', stars: '★★★★½', tone: 7, like: true, rewatch: true })
          ]
        },
        {
          label: 'AUGUST 2026', count: '19 entries',
          rows: [
            aug({ day: '30', title: 'Severance', year: '2022', code: 'S2 E1-E3', stars: '★★★★½', tone: 5, like: true, group: true, groupLabel: '3 episodes' }),
            aug({ day: '27', title: 'Conclave', year: '2024', stars: '★★★★', tone: 9, review: true }),
            aug({ day: '22', title: 'Perfect Days', year: '2023', stars: '★★★★★', tone: 3, like: true, review: true }),
            aug({ day: '18', title: 'Slow Horses', year: '2022', code: 'S4 E5-E6', stars: '★★★★', tone: 6, group: true, groupLabel: '2 episodes' }),
            aug({ day: '15', title: 'Challengers', year: '2024', stars: '★★★½', tone: 1, like: true })
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
